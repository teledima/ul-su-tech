# docker-compose.yml

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    # Подключение Airflow к PostgreSQL
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
    # Для совместимости со старыми конфигурациями
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow

    AIRFLOW__CORE__LOAD_EXAMPLES: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

  volumes:
    - airflow_dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy

x-superset-environment: &superset-env
  SUPERSET_HOME: /app/superset_home
  SUPERSET_SECRET_KEY: change-me-to-a-long-random-secret-key
  SUPERSET_SQLALCHEMY_DATABASE_URI: sqlite:////app/superset_home/superset.db
  SUPERSET_LOAD_EXAMPLES: "false"
  FLASK_ENV: production

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/sql-init/schema.sql:ro
      - ./sql/synthetic.sql:/sql-init/synthetic.sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native protocol
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        (airflow db migrate || airflow db upgrade) &&
        (airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com \
          --password admin || true)
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  superset-init:
    image: apache/superset:master
    entrypoint: /bin/sh
    command:
      - -c
      - |
        superset db upgrade &&
        (superset fab create-admin \
          --username admin \
          --firstname Admin \
          --lastname User \
          --email admin@example.com \
          --password admin || true) &&
        (superset init || true)
    environment: *superset-env
    volumes:
      - superset_home:/app/superset_home
    restart: "no"

  superset:
    image: apache/superset:master
    entrypoint: /bin/sh
    command:
      - -c
      - |
        superset run -h 0.0.0.0 -p 8088 --with-threads
    environment: *superset-env
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    depends_on:
      superset-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  clickhouse_data:
  airflow_dags:
  airflow_logs:
  superset_home: